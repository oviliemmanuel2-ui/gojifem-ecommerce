services:
  postgres:
    image: postgres:16-alpine
    container_name: gojifem-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gojifem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gojifem_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-gojifem_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gojifem -d gojifem_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gojifem-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gojifem-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-gojifem}:${POSTGRES_PASSWORD:-gojifem_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-gojifem_db}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
      WEB_URL: ${WEB_URL:-https://gojifem.com}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gojifem-prod-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.gojifem.com/api/v1}
    ports:
      - "3000:3000"

volumes:
  postgres_prod_data:
  redis_prod_data:
